packages:
  - "apps/*"
  - "packages/*"

# NOTE: `pnpm update` rewrites this file and strips every comment. After running it,
# restore this header and the pin rationales below from git before committing.
catalog:
  # Core framework
  react: ^19.3.1
  react-dom: ^19.3.1
  next: ^16.4.1
  next-themes: ^0.4.6
  zod: ^4.4.3
  # Type definitions
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@types/node": ^26.6.4
  # Build tooling
  typescript: ^5.9.3
  eslint: ^9.39.5
  tsx: ^4.23.15
  # Testing
  # Exact versions that move together: @vitest/coverage-v8 declares a strict `vitest@=X` peer,
  # so letting one float breaks the install.
  vitest: 4.1.12
  "@vitest/coverage-v8": 4.1.12
  # Charting
  echarts: ^6.1.0
  echarts-for-react: ^3.0.6
  # Shared libraries
  lucide-react: ^1.57.0
  franc: ^6.2.0
