name: Build & Quality Checks

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    name: Build & Quality Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: ./.github/actions/setup

      - name: Check theme abstraction
        timeout-minutes: 1
        run: ./scripts/check-theme-abstraction.sh

      - name: Check CVA variant duplicates
        timeout-minutes: 1
        run: ./scripts/check-cva-variants.sh packages/ui/src

      - name: Check formatting (oxfmt)
        timeout-minutes: 2
        # --threads=1 works around oxc-project/oxc#20033: race condition in
        # worker threads causes random CSS files to crash with "Cannot use
        # 'in' operator to search for 'importer' in undefined".
        run: pnpm exec oxfmt --check --threads=1 .

      - name: Lint code (oxlint + ESLint)
        timeout-minutes: 5
        run: pnpm lint --filter=!docs

      - name: Type check (tsgo)
        timeout-minutes: 5
        run: pnpm typecheck || (cat apps/web/.typecheck-results/$(ls -t apps/web/.typecheck-results/ 2>/dev/null | head -1) 2>/dev/null; exit 1)

      # The spec is committed AND publicly served, so it can drift from the
      # routes without anything noticing. It had: a stale copy documented
      # /api/v1/health, an endpoint that does not exist, and declared the API
      # MIT-licensed while the project is AGPL.
      - name: Check the committed OpenAPI spec matches the routes
        timeout-minutes: 2
        working-directory: apps/web
        run: |
          pnpm openapi:generate
          if ! git diff --quiet -- public/openapi.json public/openapi.yaml; then
            echo "::error::The committed OpenAPI spec is stale. Run 'pnpm openapi:generate' in apps/web and commit the result."
            git diff -- public/openapi.json public/openapi.yaml
            exit 1
          fi

      - name: Lint infrastructure
        timeout-minutes: 2
        run: |
          mkdir -p "$HOME/.local/bin"
          export PATH="$HOME/.local/bin:$PATH"

          # Download linting tools (to files first, not piped)
          curl -sSfL https://github.com/rhysd/actionlint/releases/download/v1.7.4/actionlint_1.7.4_linux_amd64.tar.gz -o /tmp/actionlint.tar.gz
          tar xz -C "$HOME/.local/bin" -f /tmp/actionlint.tar.gz actionlint && rm /tmp/actionlint.tar.gz
          wget -q https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64 -O "$HOME/.local/bin/hadolint"
          curl -sSfL https://github.com/mrtazz/checkmake/releases/download/0.2.2/checkmake-0.2.2.linux.amd64 -o "$HOME/.local/bin/checkmake"
          chmod +x "$HOME/.local/bin"/{actionlint,hadolint,checkmake}

          pnpm lint:devops

      - name: Build UI package
        timeout-minutes: 2
        run: pnpm build
        working-directory: packages/ui

      - name: Build Storybook
        timeout-minutes: 3
        run: pnpm storybook:build
        working-directory: packages/ui

      - name: Build web app
        timeout-minutes: 10
        run: pnpm build:compile
        working-directory: apps/web
        env:
          DATABASE_URL: postgresql://timetiles_user:timetiles_password@127.0.0.1:5432/timetiles
          PAYLOAD_SECRET: test-secret-key
          NEXT_PUBLIC_PAYLOAD_URL: http://localhost:3000
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: web-build
          path: apps/web/.next
          include-hidden-files: true
          retention-days: 1
