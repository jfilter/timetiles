name: E2E Tests

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      all_browsers:
        description: Run Firefox, WebKit and the mobile viewports as well as Chromium
        type: boolean
        default: false
  # Weekly run of the other browsers and the mobile viewports; pushes stay on Chromium.
  schedule:
    - cron: "0 3 * * 1"

jobs:
  e2e:
    # One job per browser project: each gets its own server and database, so per-user and
    # per-IP rate-limit budgets stay those of a single-project run.
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON((github.event_name == 'schedule' || inputs.all_browsers) && '["chromium","firefox","webkit","mobile-chrome","mobile-safari"]' || '["chromium"]') }}
    name: ${{ matrix.project == 'chromium' && 'E2E Tests' || format('E2E Tests ({0})', matrix.project) }}
    runs-on: ubuntu-latest
    # Run inside the official Playwright image: browsers + OS deps are baked in
    # at /ms-playwright (PLAYWRIGHT_BROWSERS_PATH), eliminating the flaky
    # cdn.playwright.dev browser download. The tag MUST match the @playwright/test
    # version locked for apps/web in pnpm-lock.yaml, enforced by
    # apps/web/tests/unit/scripts/playwright-image-pin.test.ts. Runs as root by default, so
    # Chromium requires --no-sandbox (set for CI in playwright.config.ts);
    # --ipc=host avoids Chromium shared-memory crashes.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    services:
      postgres:
        image: kartoza/postgis:17-3.5
        env:
          POSTGRES_USER: timetiles_user
          POSTGRES_PASS: timetiles_password
          POSTGRES_PASSWORD: timetiles_password
          POSTGRES_DBNAME: timetiles
          ALLOW_IP_RANGE: "0.0.0.0/0"
          FORCE_SSL: "false"
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U timetiles_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --shm-size=256mb
        ports:
          - 5432:5432

    env:
      # Base connection for database operations (globalSetup creates per-worker DBs).
      # Host is the `postgres` service label: in a container job, services are
      # reachable by name on the job network, not via 127.0.0.1 / the port map.
      DATABASE_URL: postgresql://timetiles_user:timetiles_password@postgres:5432/postgres
      PAYLOAD_SECRET: test-secret-key
      NEXT_PUBLIC_PAYLOAD_URL: http://localhost:3000
      PGPASSWORD: timetiles_password
      NODE_ENV: test
      PAYLOAD_CONFIG_PATH: ./payload.config.ts
      CI: true
      TEST_ALL_BROWSERS: ${{ (github.event_name == 'schedule' || inputs.all_browsers) && '1' || '' }}

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      # The app is NOT downloaded as an artifact: the Playwright global setup
      # (tests/e2e/global-setup.ts) always runs `pnpm build:compile` itself, so any
      # prebuilt .next it found here was overwritten before the first test ran. The
      # setup also builds @timetiles/ui. Playwright browsers are preinstalled in the
      # container image (/ms-playwright), so there is no browser install step either.

      - name: Prepare uploads directory
        run: mkdir -p uploads
        working-directory: apps/web

      - name: Run E2E tests (parallel workers)
        timeout-minutes: 20
        # The job runs as root, but $HOME belongs to pwuser; Firefox refuses to launch then.
        env:
          HOME: /root
        run: pnpm test:e2e --project="${{ matrix.project }}"
        working-directory: apps/web

      - name: Upload E2E test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results-${{ matrix.project }}
          path: apps/web/test-results
          retention-days: 7

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.project }}
          path: apps/web/playwright-report
          retention-days: 7
