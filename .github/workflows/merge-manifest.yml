# Reusable workflow: Create a multi-arch Docker manifest from per-platform digests
# Must run after build-image.yml has produced digest artifacts

name: Create Multi-Arch Manifest

on:
  workflow_call:
    inputs:
      image-name:
        description: "Full image name including registry (must match build-image.yml)"
        required: true
        type: string
      scope:
        description: "Artifact scope (must match build-image.yml)"
        required: true
        type: string
      flavor:
        description: "Docker metadata flavor (e.g., suffix=-allinone,onlatest=true)"
        required: false
        type: string
        default: ""
      # github.event_name is 'workflow_call' in called workflows,
      # so the caller must pass the original event context for tag logic
      original-event-name:
        description: "The original triggering event name (push, schedule, workflow_dispatch)"
        required: true
        type: string
      dispatch-tag:
        description: "The tag input from workflow_dispatch, if any"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  merge:
    name: Create Manifest
    runs-on: ubuntu-latest

    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-${{ inputs.scope }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ inputs.image-name }}
          flavor: ${{ inputs.flavor }}
          # `latest` is deliberately NOT a type=raw tag here. A raw tag enabled on
          # "any tag push" moved :latest onto every prerelease (v0.1.0-alpha.N),
          # so a bare `docker pull` from the self-hosting docs served an alpha.
          # metadata-action's default `latest=auto` flavor already implements the
          # correct rule: it sets :latest only when a type=semver pattern matches
          # and the version has no prerelease identifier. The allinone caller
          # passes `onlatest=true`, which applies its `-allinone` suffix to that
          # auto-generated latest tag as well.
          #
          # `value=` on the semver entries is empty on tag pushes (metadata-action
          # then falls back to the git tag, its documented default) and carries the
          # workflow_dispatch tag input otherwise, so a dispatched build is tagged
          # for the tag it actually built instead of producing no tags at all.
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.dispatch-tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.dispatch-tag }}
            type=raw,value=edge,enable=${{ inputs.original-event-name == 'schedule' || (inputs.original-event-name == 'workflow_dispatch' && inputs.dispatch-tag == '') }}

      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          COUNT=$(ls | wc -l)
          if [ "$COUNT" -ne 2 ]; then
            echo "ERROR: Expected 2 platform digests, got $COUNT"
            ls -la
            exit 1
          fi

          DIGESTS=$(printf '${{ inputs.image-name }}@sha256:%s ' *)
          TAG_ARGS=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          docker buildx imagetools create $TAG_ARGS $DIGESTS

      - name: Inspect manifest
        run: |
          TAG=$(jq -cr '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          docker buildx imagetools inspect "$TAG"
