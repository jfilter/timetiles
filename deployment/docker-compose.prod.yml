# Load environment variables from .env.production
# Usage: docker-compose -f docker-compose.prod.yml --env-file .env.production up

services:
  # PostgreSQL with PostGIS extensions
  # Uses kartoza/postgis by default for multi-arch support (amd64 + arm64)
  # Set POSTGRES_IMAGE=postgis/postgis for official image on x86 systems
  postgres:
    image: ${POSTGRES_IMAGE:-kartoza/postgis}:${POSTGRES_VERSION:-17-3.5}
    container_name: ${COMPOSE_PROJECT_NAME:-timetiles}-postgres
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    environment:
      # Standard postgres image variables
      POSTGRES_DB: ${DB_NAME:-timetiles}
      POSTGRES_USER: ${DB_USER:-timetiles_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      # Kartoza image variables (for ARM64 compatibility)
      POSTGRES_DBNAME: ${DB_NAME:-timetiles}
      POSTGRES_PASS: ${DB_PASSWORD}
      # Kartoza networking - restrict to Docker bridge subnet
      ALLOW_IP_RANGE: "172.16.0.0/12"
      # Disable kartoza's SSL (nginx handles SSL termination)
      FORCE_SSL: "false"
      # PostgreSQL tuning via kartoza's EXTRA_CONF
      EXTRA_CONF: |
        max_locks_per_transaction = ${PG_MAX_LOCKS:-1024}
        max_stack_depth = ${PG_STACK_DEPTH:-7680kB}
        work_mem = ${PG_WORK_MEM:-32MB}
        shared_buffers = ${PG_SHARED_BUFFERS:-256MB}
        max_connections = ${PG_MAX_CONNECTIONS:-100}
        effective_cache_size = ${PG_CACHE_SIZE:-1GB}
        maintenance_work_mem = ${PG_MAINTENANCE_MEM:-128MB}
        checkpoint_completion_target = 0.9
        wal_buffers = 16MB
        random_page_cost = 1.1
        log_statement = ${PG_LOG_STATEMENT:-none}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      # Use -h localhost to force TCP connection (avoids peer auth issues with kartoza/postgis)
      # Don't check for specific database (-d) as it may not exist yet during initial startup
      test: ["CMD-SHELL", "pg_isready -h localhost -U ${DB_USER:-timetiles_user}"]
      interval: 5s
      timeout: 5s
      retries: 10
      # kartoza/postgis first-run init (extensions, users, restart) can take
      # >90s on slow disks; on subsequent recreates the container also bounces
      # postgres briefly during the entrypoint's "restart in foreground" step.
      # 180s gives both cases enough headroom; 5s interval + 10 retries keeps
      # recovery detection snappy after start_period elapses.
      start_period: 180s
    networks:
      - timetiles-network

  # Web application
  web:
    image: ${TIMETILES_IMAGE:-ghcr.io/jfilter/timetiles}:${TIMETILES_VERSION:-latest}
    container_name: ${COMPOSE_PROJECT_NAME:-timetiles}-web
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    # No ports exposed directly - nginx handles this.
    #
    # 3000 is hardcoded here and below, deliberately. It used to be
    # ${CONTAINER_PORT:-3000}, which made the port look configurable while two
    # consumers ignored it: this service's healthcheck hardcodes 3000, and
    # nginx/nginx.conf hardcodes `server web:3000`. Setting CONTAINER_PORT
    # therefore moved the listener away from both, so web never reported
    # healthy, the workers (which gate on web's health) never started, and nginx
    # proxied to a closed port -- the whole stack deadlocked on a knob the
    # template advertised. nginx.conf is a plain bind-mounted file with no
    # substitution step for compose-only installs, so there is nowhere to
    # honour the value; the knob is gone from .env.production.example instead.
    expose:
      - "3000"
    # Allow the web container to reach host-native services (e.g., scraper runner)
    # Remove this block if scraper runner is not used
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      # Next.js image optimizer writes to .next/cache/images on every
      # /_next/image hit. Without a writable cache mount it errors on
      # each request (read-only rootfs) and degrades to non-cached
      # responses — sharp resizes per request. tmpfs is ephemeral but
      # the image cache is fully regenerable.
      - /app/apps/web/.next/cache:size=512m,uid=1001,gid=1001
    environment:
      # Database
      DATABASE_URL: postgresql://${DB_USER:-timetiles_user}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-timetiles}

      # Payload CMS
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      NEXT_PUBLIC_PAYLOAD_URL: ${NEXT_PUBLIC_PAYLOAD_URL:-http://localhost:3000}

      # Application
      NODE_ENV: ${NODE_ENV:-production}
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-production}
      # Trusted reverse-proxy CIDRs for client-IP extraction. In production the
      # app ignores X-Forwarded-For unless the sending hop is inside this
      # allowlist (headers are client-spoofable otherwise). Without it EVERY
      # client collapses to "unknown" and shares a single rate-limit bucket.
      # The default covers the Docker bridge network (nginx sits on it, same
      # range as postgres ALLOW_IP_RANGE); extend it if a CDN/edge LB fronts
      # nginx so the real client survives the forwarded chain.
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-172.16.0.0/12}
      # Auto-activate data packages on Payload boot (web container only —
      # workers leave this unset to avoid racing on the same idempotency
      # check). See apps/web/lib/data-packages/auto-activator.ts.
      RUN_AUTO_ACTIVATIONS: ${RUN_AUTO_ACTIVATIONS:-true}
      # See the `expose` block above for why this is not configurable.
      PORT: "3000"

      # Logging (all containers write to /var/log/timetiles/ via shared volume)
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FILE: /var/log/timetiles/web.log
      # Without this the value in .env.production never reaches the container:
      # compose has no env_file, so the app always used the in-memory store --
      # per-process counters and an empty pg table, with nothing logged.
      RATE_LIMIT_BACKEND: ${RATE_LIMIT_BACKEND:-memory}
      # Absolute and shared, because the pieces live in different containers:
      # a worker writes the file, web stat()s the stored absolute path to serve
      # the download, and the maintenance worker deletes it on expiry. The
      # default is the relative ".exports", which resolves inside each
      # container's read-only rootfs and fails with EROFS.
      DATA_EXPORT_DIR: /app/apps/web/exports

      # File uploads
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/apps/web/uploads}

      # Email (SMTP) - required for production
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-587}
      EMAIL_SMTP_TLS_SERVERNAME: ${EMAIL_SMTP_TLS_SERVERNAME:-}
      EMAIL_FROM: ${EMAIL_FROM}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-${EMAIL_FROM}}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-TimeTiles}
      EMAIL_SMTP_USER: ${EMAIL_SMTP_USER:-}
      EMAIL_SMTP_PASS: ${EMAIL_SMTP_PASS:-}

      # Scraper runner (optional - leave empty to disable)
      SCRAPER_RUNNER_URL: ${SCRAPER_RUNNER_URL:-}
      SCRAPER_API_KEY: ${SCRAPER_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Persist uploaded files on host for easy backup/restore
      - ${UPLOAD_HOST_DIR:-./uploads}:/app/apps/web/uploads
      - ${EXPORT_HOST_DIR:-./exports}:/app/apps/web/exports
      - ${LOG_HOST_DIR:-./logs}:/var/log/timetiles
      # Application config (optional — all values have defaults)
      - ${CONFIG_DIR:-./config}:/app/apps/web/config:ro
    networks:
      - timetiles-network
    healthcheck:
      # 127.0.0.1 not localhost: Node resolves localhost via dns.lookup which
      # tries the AAAA record first, but the server only binds 0.0.0.0.
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000/api/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1); }).on('error', () => { process.exit(1); })",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      # Long enough to cover a slow migration. This container applies pending
      # migrations during Payload init, and /api/health cannot answer until
      # that finishes, so the startup grace period has to outlast the longest
      # plausible migration rather than a normal boot. It also gates more than
      # itself now: the workers wait for this health check, so a premature
      # "unhealthy" here would keep them from starting at all.
      start_period: 180s

  # Ingest worker — processes ingest workflows (high throughput)
  worker-ingest:
    image: ${TIMETILES_IMAGE:-ghcr.io/jfilter/timetiles}:${TIMETILES_VERSION:-latest}
    container_name: ${COMPOSE_PROJECT_NAME:-timetiles}-worker-ingest
    working_dir: /app/apps/web
    # The scraper runner is a host-native service, and scraper-execution runs
    # on the ingest queue -- so this container makes the call, not web. Without
    # the host mapping every scraper run fails on DNS here, while the health
    # check probes the same URL from web, which can resolve it, and reports the
    # runner reachable.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    command:
      [
        "node",
        "/app/node_modules/.pnpm/node_modules/payload/bin.js",
        "jobs:run",
        "--cron",
        "*/10 * * * * *",
        "--queue",
        "ingest",
        "--limit",
        "10",
      ]
    environment:
      DATABASE_URL: postgresql://${DB_USER:-timetiles_user}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-timetiles}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      NEXT_PUBLIC_PAYLOAD_URL: ${NEXT_PUBLIC_PAYLOAD_URL:-http://localhost:3000}
      NODE_ENV: ${NODE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FILE: /var/log/timetiles/worker-ingest.log
      # Only the web container migrates. Payload applies prodMigrations during
      # init without taking a lock, so leaving this on would have all four app
      # containers run the same DDL against one database the moment the stack
      # comes up. depends_on below keeps this container from starting until web
      # reports healthy, which it only does after its migrations finished.
      RUN_MIGRATIONS: "false"
      # Without this the value in .env.production never reaches the container:
      # compose has no env_file, so the app always used the in-memory store --
      # per-process counters and an empty pg table, with nothing logged.
      RATE_LIMIT_BACKEND: ${RATE_LIMIT_BACKEND:-memory}
      # Transactional mail is queued as a job and therefore SENT BY A WORKER,
      # not by web. Without these the worker falls through to the no-op
      # jsonTransport in payload-config-factory.ts and marks every send
      # successful, so account verification and password reset die silently
      # while the web container's health check reports email healthy.
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-587}
      EMAIL_SMTP_TLS_SERVERNAME: ${EMAIL_SMTP_TLS_SERVERNAME:-}
      EMAIL_FROM: ${EMAIL_FROM}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-${EMAIL_FROM}}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-TimeTiles}
      EMAIL_SMTP_USER: ${EMAIL_SMTP_USER:-}
      EMAIL_SMTP_PASS: ${EMAIL_SMTP_PASS:-}
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/apps/web/uploads}
      # This is the only worker that reaches the scraper runner: both the manual
      # trigger and the schedule queue the `scraper-ingest` workflow, which
      # declares queue "ingest". The other workers never call it.
      SCRAPER_RUNNER_URL: ${SCRAPER_RUNNER_URL:-}
      SCRAPER_API_KEY: ${SCRAPER_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      web:
        condition: service_healthy
    volumes:
      - ${UPLOAD_HOST_DIR:-./uploads}:/app/apps/web/uploads
      - ${LOG_HOST_DIR:-./logs}:/var/log/timetiles
      - ${CONFIG_DIR:-./config}:/app/apps/web/config:ro
    networks:
      - timetiles-network
    # Image carries an HTTP-based HEALTHCHECK (Dockerfile.prod) that targets
    # the Next.js server. Workers run `payload jobs:run` instead, so they
    # never bind a port — the inherited check would always fail. Disable.
    healthcheck:
      disable: true

  # General worker — scheduled jobs, webhooks, maintenance, cleanup
  worker-general:
    image: ${TIMETILES_IMAGE:-ghcr.io/jfilter/timetiles}:${TIMETILES_VERSION:-latest}
    container_name: ${COMPOSE_PROJECT_NAME:-timetiles}-worker-general
    working_dir: /app/apps/web
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    command: [
        "node",
        "/app/node_modules/.pnpm/node_modules/payload/bin.js",
        "jobs:run",
        "--cron",
        "*/1 * * * *",
        # One queue per worker. --queue takes exactly one value: Payload matches
        # it with `equals`, so "default,maintenance" matched no job at all and
        # both queues silently accumulated work that was never tried.
        "--queue",
        "default",
        "--limit",
        "20",
        "--handle-schedules",
      ]
    environment:
      DATABASE_URL: postgresql://${DB_USER:-timetiles_user}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-timetiles}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      NEXT_PUBLIC_PAYLOAD_URL: ${NEXT_PUBLIC_PAYLOAD_URL:-http://localhost:3000}
      NODE_ENV: ${NODE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FILE: /var/log/timetiles/worker-general.log
      # See worker-ingest: only web migrates, and this container waits for it.
      RUN_MIGRATIONS: "false"
      # Without this the value in .env.production never reaches the container:
      # compose has no env_file, so the app always used the in-memory store --
      # per-process counters and an empty pg table, with nothing logged.
      RATE_LIMIT_BACKEND: ${RATE_LIMIT_BACKEND:-memory}
      # Absolute and shared, because the pieces live in different containers:
      # a worker writes the file, web stat()s the stored absolute path to serve
      # the download, and the maintenance worker deletes it on expiry. The
      # default is the relative ".exports", which resolves inside each
      # container's read-only rootfs and fails with EROFS.
      DATA_EXPORT_DIR: /app/apps/web/exports
      # Transactional mail is queued as a job and therefore SENT BY A WORKER,
      # not by web. Without these the worker falls through to the no-op
      # jsonTransport in payload-config-factory.ts and marks every send
      # successful, so account verification and password reset die silently
      # while the web container's health check reports email healthy.
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-587}
      EMAIL_SMTP_TLS_SERVERNAME: ${EMAIL_SMTP_TLS_SERVERNAME:-}
      EMAIL_FROM: ${EMAIL_FROM}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-${EMAIL_FROM}}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-TimeTiles}
      EMAIL_SMTP_USER: ${EMAIL_SMTP_USER:-}
      EMAIL_SMTP_PASS: ${EMAIL_SMTP_PASS:-}
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/apps/web/uploads}
      # No SCRAPER_* here on purpose: the scraper runs as the `scraper-ingest`
      # workflow on the "ingest" queue, so only worker-ingest ever calls the
      # runner. Passing the URL and key to a worker that cannot use them just
      # spreads the credential further than it needs to go.
    depends_on:
      postgres:
        condition: service_healthy
      web:
        condition: service_healthy
    volumes:
      - ${UPLOAD_HOST_DIR:-./uploads}:/app/apps/web/uploads
      - ${EXPORT_HOST_DIR:-./exports}:/app/apps/web/exports
      - ${LOG_HOST_DIR:-./logs}:/var/log/timetiles
      - ${CONFIG_DIR:-./config}:/app/apps/web/config:ro
    networks:
      - timetiles-network
    # See worker-ingest above.
    healthcheck:
      disable: true

  # Nginx reverse proxy with SSL support

  # Maintenance worker — cleanup and retention jobs
  #
  # Separate from worker-general because --queue takes exactly one value:
  # Payload matches it with `equals`, so "default,maintenance" matched no
  # job at all and both queues sat idle. --all-queues would cover them, but
  # it would also let this worker race worker-ingest for ingest jobs, and
  # Payload's concurrency-key guard reads before it locks -- two workers
  # polling the same instant can admit two different jobs sharing one key,
  # which for a double-clicked ingest retry means duplicate events.
  worker-maintenance:
    image: ${TIMETILES_IMAGE:-ghcr.io/jfilter/timetiles}:${TIMETILES_VERSION:-latest}
    container_name: ${COMPOSE_PROJECT_NAME:-timetiles}-worker-maintenance
    working_dir: /app/apps/web
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    command: [
        "node",
        "/app/node_modules/.pnpm/node_modules/payload/bin.js",
        "jobs:run",
        "--cron",
        "*/1 * * * *",
        # One queue per worker. --queue takes exactly one value: Payload matches
        # it with `equals`, so "default,maintenance" matched no job at all and
        # both queues silently accumulated work that was never tried.
        "--queue",
        "maintenance",
        "--limit",
        "20",
        # Each worker schedules only its OWN queue: handleSchedules skips any
        # schedule whose queue differs from --queue (handleSchedules/index.js:36).
        # A single scheduler on `default` therefore left all twelve maintenance
        # schedules unqueued -- this worker consumed a queue nobody filled.
        # Two schedulers are safe precisely because the filter makes their work
        # disjoint; they would only double-queue if they shared a queue.
        "--handle-schedules",
      ]
    environment:
      DATABASE_URL: postgresql://${DB_USER:-timetiles_user}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-timetiles}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      NEXT_PUBLIC_PAYLOAD_URL: ${NEXT_PUBLIC_PAYLOAD_URL:-http://localhost:3000}
      NODE_ENV: ${NODE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FILE: /var/log/timetiles/worker-maintenance.log
      # See worker-ingest: only web migrates, and this container waits for it.
      RUN_MIGRATIONS: "false"
      # Without this the value in .env.production never reaches the container:
      # compose has no env_file, so the app always used the in-memory store --
      # per-process counters and an empty pg table, with nothing logged.
      RATE_LIMIT_BACKEND: ${RATE_LIMIT_BACKEND:-memory}
      # Absolute and shared, because the pieces live in different containers:
      # a worker writes the file, web stat()s the stored absolute path to serve
      # the download, and the maintenance worker deletes it on expiry. The
      # default is the relative ".exports", which resolves inside each
      # container's read-only rootfs and fails with EROFS.
      DATA_EXPORT_DIR: /app/apps/web/exports
      # Transactional mail is queued as a job and therefore SENT BY A WORKER,
      # not by web. Without these the worker falls through to the no-op
      # jsonTransport in payload-config-factory.ts and marks every send
      # successful, so account verification and password reset die silently
      # while the web container's health check reports email healthy.
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-587}
      EMAIL_SMTP_TLS_SERVERNAME: ${EMAIL_SMTP_TLS_SERVERNAME:-}
      EMAIL_FROM: ${EMAIL_FROM}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-${EMAIL_FROM}}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-TimeTiles}
      EMAIL_SMTP_USER: ${EMAIL_SMTP_USER:-}
      EMAIL_SMTP_PASS: ${EMAIL_SMTP_PASS:-}
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/apps/web/uploads}
      # No SCRAPER_* here on purpose: the scraper runs as the `scraper-ingest`
      # workflow on the "ingest" queue, so only worker-ingest ever calls the
      # runner. Passing the URL and key to a worker that cannot use them just
      # spreads the credential further than it needs to go.
    depends_on:
      postgres:
        condition: service_healthy
      web:
        condition: service_healthy
    volumes:
      - ${UPLOAD_HOST_DIR:-./uploads}:/app/apps/web/uploads
      - ${EXPORT_HOST_DIR:-./exports}:/app/apps/web/exports
      - ${LOG_HOST_DIR:-./logs}:/var/log/timetiles
      - ${CONFIG_DIR:-./config}:/app/apps/web/config:ro
    networks:
      - timetiles-network
    # See worker-ingest above.
    healthcheck:
      disable: true

  # Nginx reverse proxy with SSL support
  nginx:
    image: nginx:${NGINX_VERSION:-1.27-alpine}
    container_name: ${COMPOSE_PROJECT_NAME:-timetiles}-nginx
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE # Required for binding to ports 80/443
      - CHOWN # Required for nginx cache directory setup
      - SETUID # Required for nginx worker process privilege drop
      - SETGID # Required for nginx worker process privilege drop
      - DAC_READ_SEARCH # Required for reading SSL private key files
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ${NGINX_CONF_PATH:-./nginx/nginx.conf}:/etc/nginx/nginx.conf:ro
      - ./nginx/sites-enabled:/etc/nginx/sites-enabled:ro
      - ./nginx/proxy-headers.conf:/etc/nginx/proxy-headers.conf:ro
      - ./nginx/security-headers.conf:/etc/nginx/security-headers.conf:ro
      - ./nginx/security-headers-https.conf:/etc/nginx/security-headers-https.conf:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
    depends_on:
      - web
    networks:
      - timetiles-network
    healthcheck:
      # 127.0.0.1 not localhost: nginx binds 0.0.0.0:80, but BusyBox wget
      # in the alpine image resolves localhost to ::1 first and never
      # falls back to IPv4 → the check would always report unhealthy.
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Certbot for Let's Encrypt SSL certificates
  certbot:
    image: certbot/certbot:${CERTBOT_VERSION:-v3.3.0}
    container_name: ${COMPOSE_PROJECT_NAME:-timetiles}-certbot
    restart: unless-stopped
    volumes:
      - letsencrypt:/etc/letsencrypt
      # Pin /var/lib/letsencrypt to a named volume. The certbot image declares
      # it as an image-level VOLUME; left unmapped, Docker spawns a fresh
      # ANONYMOUS volume on every container recreate (a health-check restart
      # loop once stranded ~1150 empty ones on a staging host). Naming it also
      # lets certbot keep its work/archive state across recreates.
      - letsencrypt-lib:/var/lib/letsencrypt
      - certbot-webroot:/var/www/certbot
    entrypoint: '/bin/sh -c ''trap exit TERM; while :; do certbot renew --deploy-hook "touch /etc/letsencrypt/.renewed"; sleep 12h & wait $${!}; done;'''
    depends_on:
      - nginx

volumes:
  postgres_data:
    driver: local
  letsencrypt:
    driver: local
  letsencrypt-lib:
    driver: local
  certbot-webroot:
    driver: local

networks:
  timetiles-network:
    driver: bridge
    # Pinned, not left to Docker's allocator.
    #
    # The host firewall has to name this range. worker-ingest reaches the
    # scraper runner at host.docker.internal:4000 — a host-native service, so
    # that traffic lands in the host's INPUT chain, where bootstrap step 03's
    # `ufw default deny incoming` drops it. Step 13 opens port 4000 for this
    # subnet and nothing else, which keeps the runner unreachable from the LAN.
    # An auto-allocated subnet cannot be named that way: Docker hands out
    # 172.17→172.31 in creation order, so the range this network gets depends on
    # what else exists on the host and changes when networks are recreated —
    # a firewall rule written against it would go stale silently and every
    # scraper run would start failing again.
    #
    # 172.16.238.0/24 is deliberate on both ends: inside 172.16.0.0/12, so
    # TRUSTED_PROXY_CIDRS and postgres's ALLOW_IP_RANGE still cover it and the
    # scraper sandbox's egress denylist still fences scrapers off from it; but
    # outside 172.17.0.0/16–172.31.0.0/16, which is Docker's own default pool,
    # so it cannot collide with a network Docker allocated by itself.
    #
    # Override only if it clashes with a real route on your host — and set the
    # same value in .env.production, which is where step 13 reads it from.
    ipam:
      config:
        - subnet: ${DOCKER_NETWORK_SUBNET:-172.16.238.0/24}
