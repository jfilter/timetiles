# Every service logs to the container's stdout (/dev/fd/1 is supervisord's own
# stdout, which Docker owns), not to files: `docker logs` and log shippers see
# them, and the Docker log driver handles rotation. This is also why the app runs
# without LOG_FILE (see entrypoint.sh) — with it, pino would write lines twice.
#
# stdout_logfile_maxbytes=0 is required: supervisord's rotation would otherwise
# try to seek and stat a pipe. redirect_stderr merges each service's stderr into
# the same stream instead of opening a second handle to it.

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:postgresql]
command=/usr/lib/postgresql/17/bin/postgres -D /data/postgresql
user=postgres
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:nextjs]
command=/app/start-nextjs.sh
user=nextjs
directory=/app
autostart=true
autorestart=true
priority=20
startsecs=10
startretries=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

# Background jobs: scheduled imports, scraper-repo syncs, stuck-run cleanup,
# account deletion and the audit-log IP purge. A queue with no worker sits
# untouched without raising any error.
#
# One worker for every queue, unlike the compose deployment which splits ingest
# onto its own faster loop -- a single container has no reason to run two.
#
# The higher priority starts this after Next.js, but that is ordering only, not
# a barrier: supervisord considers a program started once it has stayed alive
# for startsecs (10s below), which says nothing about whether migrations have
# finished. Correctness comes from start-worker.sh setting RUN_MIGRATIONS=false,
# so only Next.js ever applies them; the worker retries until the schema is there.
[program:worker]
command=/app/start-worker.sh
user=nextjs
directory=/app
autostart=true
autorestart=true
priority=25
startsecs=10
startretries=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
