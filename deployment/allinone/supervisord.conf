[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[program:postgresql]
command=/usr/lib/postgresql/17/bin/postgres -D /data/postgresql
user=postgres
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/postgresql.log
stderr_logfile=/var/log/supervisor/postgresql.log

[program:nextjs]
command=/app/start-nextjs.sh
user=nextjs
directory=/app
autostart=true
autorestart=true
priority=20
startsecs=10
startretries=3
stdout_logfile=/var/log/supervisor/nextjs.log
stderr_logfile=/var/log/supervisor/nextjs.log

# Background jobs. Without this nothing scheduled ever runs in the all-in-one
# image: scheduled imports, scraper-repo syncs, stuck-run cleanup, account
# deletion and the 30-day audit-log IP purge all sit in their queues untouched,
# silently, because a queue with no worker produces no error.
#
# One worker for every queue, unlike the compose deployment which splits ingest
# onto its own faster loop -- a single container has no reason to run two.
# Starts after Next.js (priority) so migrations have run first.
[program:worker]
command=/app/start-worker.sh
user=nextjs
directory=/app
autostart=true
autorestart=true
priority=25
startsecs=10
startretries=3
stdout_logfile=/var/log/supervisor/worker.log
stderr_logfile=/var/log/supervisor/worker.log

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=30
stdout_logfile=/var/log/supervisor/nginx.log
stderr_logfile=/var/log/supervisor/nginx.log
