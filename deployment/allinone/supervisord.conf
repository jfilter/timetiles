# Every service logs to the container's stdout (/dev/fd/1 is supervisord's own
# stdout, which Docker owns), not to files.
#
# The alternative — files under /data with a logrotate install — would put the
# logs of a one-process-per-container-style image somewhere `docker logs`,
# `docker compose logs` and every log shipper cannot see, and would need a cron
# daemon in the image just to keep them bounded. Sending them to stdout hands
# rotation and retention to the Docker log driver, which the operator already
# configures per host. This is also why the app deliberately runs without
# LOG_FILE (see entrypoint.sh) — with it, pino would write the same lines twice.
#
# stdout_logfile_maxbytes=0 is required: supervisord's rotation would otherwise
# try to seek and stat a pipe. redirect_stderr merges each service's stderr into
# the same stream instead of opening a second handle to it.

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[program:postgresql]
command=/usr/lib/postgresql/17/bin/postgres -D /data/postgresql
user=postgres
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:nextjs]
command=/app/start-nextjs.sh
user=nextjs
directory=/app
autostart=true
autorestart=true
priority=20
startsecs=10
startretries=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

# Background jobs. Without this nothing scheduled ever runs in the all-in-one
# image: scheduled imports, scraper-repo syncs, stuck-run cleanup, account
# deletion and the 30-day audit-log IP purge all sit in their queues untouched,
# silently, because a queue with no worker produces no error.
#
# One worker for every queue, unlike the compose deployment which splits ingest
# onto its own faster loop -- a single container has no reason to run two.
# Starts after Next.js (priority) so migrations have run first.
[program:worker]
command=/app/start-worker.sh
user=nextjs
directory=/app
autostart=true
autorestart=true
priority=25
startsecs=10
startretries=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
